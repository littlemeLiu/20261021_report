</style><header><div>◎ <b>敏捷偵探社</b> <small>THE THREE CASES</small></div><div class="header-actions"><button id="musicToggle" aria-pressed="false" onclick="toggleMusic()">♫ 配樂</button><button onclick="toggleFull()">全螢幕</button></div></header><audio id="bgm" src="assets/tamsui-mystery.wav" loop preload="none"></audio><main><div id="inventory" aria-label="鑰匙收集進度"></div><div id="scene" class="scene-enter"></div><nav id="nav" aria-label="故事章節"></nav><footer><span>結訓報告 · 敏捷力 · 三關九道推理</span><span>案件為故事包裝；「實際經歷」依組員提供內容整理，錯誤分支為情境推演。</span></footer></main><script>const cases=[
{title:'失控的機械密室',sub:'機器人挑戰',symbol:'⚙',word:'小步快走',intro:'通往檔案室的門被封鎖。只有讓機器人移動到射擊位置、命中目標，才能取得第一枚密碼。可是，這台機器人似乎總在偏離路線……',facts:'我們先做出能前進與射擊的雛形，再調整左右輪參數、檢查配重；換賽道後發現地形也會影響行進與瞄準，最後在不影響賽制下調整起始位置，以提高命中表現。',lesson:'先做可運作的雛形，再依現場回饋修正；環境改變時，重新驗證原本的方法。',work:'工作應用提案：先做可供檢視的小版本；換場域、使用者或條件時重新測試，再依回饋調整。',steps:[
{title:'尚未成形的機械助手',story:'密室裡留下機器人的零件與射擊目標。小隊還不知道哪些設計能有效運作。',question:'第一步該怎麼展開調查？',options:['先打造能前進與射擊的雛形，立即測試。','先把所有功能與路線設計完整，再開始試跑。'],correct:0,good:'雛形啟動了！測試立刻揭露新的線索：它能前進與射擊，卻無法直線行走。',bad:'你們還沒有取得實測回饋。即使設計得很完整，也無法確認它在現場會如何移動。先縮小第一步。',clue:'能運作的雛形，讓問題提早被看見。'},
{title:'最後一發的角度',story:'目標就在眼前。小隊需要兼顧賽制與命中表現，不能只執著於把所有偏移一次修到完美。',question:'下一個可行的小調整是？',options:['移動賽場目標物，讓它配合機器人的射擊方向。','在不影響賽制的前提下，調整機器人的起始位置再試射。'],correct:1,good:'起始位置成為新的調整點！你們在規則內改變策略，朝精準射擊與更高分的目標前進。第一把鑰匙從機械密室浮現。',bad:'自行移動目標物會改變任務條件。回到可調整的範圍，尋找規則內能驗證的做法。',clue:'在限制內換一種方法，小步精進也能接近目標。'}]},
{title:'無光房間的第七雙眼',sub:'盲眼拼圖挑戰',symbol:'◈',word:'快人一步',intro:'收銀機抽屜裡的第二把鑰匙，打開了一間無光房間。六位偵探必須戴上眼罩，拼回破碎的地圖。倒數不斷縮短，真正的出口卻藏在看不見的資訊裡。',facts:'六位組員先在明眼狀態熟悉各自拼圖，再戴眼罩練習並完成第一目標。時間大幅縮短後，單靠盲練出現疲憊與效率瓶頸；其他組成員主動擔任「眼」，提供順序與方向提示，協助達成極限目標。',lesson:'遇到瓶頸時，停止只靠原方法加速；接納外部視角，用即時回饋改變行動。',work:'工作應用提案：進度停滯時，邀請跨組同事或使用者觀察，補足資訊，再試新的協作方式。',steps:[
{title:'熄燈之前',story:'六副眼罩放在桌上。燈光尚未熄滅，每人面前都有自己負責的拼圖片。',question:'開始前，要先建立什麼線索？',options:['先看清並摸熟自己的拼圖形狀與特徵，對齊任務。','直接戴眼罩，等開始後再各自辨認所有拼圖。'],correct:0,good:'小隊建立了共同起點。每個人先熟悉自己負責的部分，為資訊受限的執行做準備。',bad:'尚未熟悉拼圖就失去視覺，會增加摸索的不確定性。利用現有資訊，先建立共同認知。',clue:'先熟悉任務與分工，建立共同起點。'},
{title:'指尖上的地圖',story:'戴上眼罩後，視覺消失了。記憶與觸覺成為僅有的線索，動作卻還不熟練。',question:'如何接近第一次目標？',options:['只在腦中反覆推演，等所有人都確定不會出錯再動手。','開始練習，根據摸索結果修正動作，逐次熟悉。'],correct:1,good:'透過動態練習與試錯，你們在限制時間內完成第一次目標。行動本身帶來了新資訊。',bad:'完全確定才行動，會讓你們缺少實際操作的回饋。先試一輪，才知道哪裡需要調整。',clue:'執行、觀察、調整，讓每次試錯都有收穫。'},
{title:'縮短的倒數',story:'新目標時間大幅縮短。小隊持續盲練，卻愈來愈疲憊，效率停滯甚至退步。',question:'此刻最需要改變的是什麼？',options:['調整策略，重新出發','不調整策略，持續練習速度'],correct:0,good:'你們辨認出瓶頸：只靠局部努力已無法突破。需要的可能不是更快的手，而是更清楚的資訊。',bad:'更多相同的盲練可能累積疲憊，卻沒有補上資訊落差。方法已遇到瓶頸，策略也要跟著改變。',clue:'效率停滯，是重新檢視方法的訊號。'},
{title:'門外傳來的提示',story:'其他組的成員主動加入，願意成為你們的「眼」，即時提示拿取順序與方向。',question:'小隊要如何回應這份新資訊？',options:['拒絕提示，堅持只靠六個人的記憶完成。','接納外部提示，依即時資訊調整拿取與拼接動作。'],correct:1,good:'順序與方向變清楚了！外部即時回饋讓摸索轉為有方向的行動，協助你們達成極限目標。第三把鑰匙出現，最終檔案室即將開啟。',bad:'拒絕外部視角，就保留了原本的資訊落差。敏捷也包含願意借助他人，調整合作方式。',clue:'資訊透明與外部回饋，能幫助團隊突破瓶頸。'}]},
{title:'古老收銀機的十秒陷阱',sub:'數字順序挑戰',symbol:'⌛',word:'實驗修正',intro:'機械密室的第一把鑰匙，帶你們找到一台古老收銀機。依序觸碰數字即可打開封存的抽屜，但圓圈裡藏著一條容易被誤讀的計時規則。快一步，真的會更快嗎？',facts:'第一回合由一人進圈、其他人在外提示。第二回合兩人同時進圈，原以為只會一次加十秒，卻發現多一人在場的每一秒都加十秒。第三回合回歸單人操作，改以熟練度、專注力與流程優化提升表現。',lesson:'新策略要先確認規則與成本假設；發現策略失效後，及時修正，將努力轉向有效的流程。',work:'工作應用提案：嘗試新流程前確認限制與計算方式；失敗後保留有效部分，修正錯誤假設。',steps:[
{title:'圓圈內的第一步',story:'規則要求由小到大觸摸數字，操作限在圓圈內，同時間只能有一人在圈中；多人進入會加計時間。',question:'第一回合如何建立可行流程？',options:['一人進圈觸摸，其餘人在外依序提示位置。','全員進圈，各自找數字，等結束後再計算罰時。'],correct:0,good:'單人操作、圈外支援，讓小隊先熟悉環境與流程。這就是後續比較策略的起點。',bad:'多人進圈會觸發加計時間，也讓順序更難掌握。先用符合人員限制的方法建立流程。',clue:'先掌握規則，建立可比較的初始做法。'},
{title:'兩個人會更快嗎？',story:'第二回合前，有人提議兩人進圈：「就算加十秒，應該也划算。」但這個成本估算還沒核對。',question:'身為偵探，你會先問哪件事？',options:['兩人動作夠不夠快？罰時就先當成一次十秒。','十秒是只加一次，還是每多一人在場的每秒都加？'],correct:1,good:'關鍵就在「每秒」。回看真實經歷：你們當時採用了雙人策略，才發現誤以為一次十秒的假設錯了，導致大量罰時。',bad:'這正是真實第二回合踩到的陷阱：以為只加一次十秒。實際上，多一人在場的每秒都會加十秒。速度優勢可能被罰時吃掉。',clue:'決策前先驗證成本假設，不把猜測當成規則。'},

function puzzleHelpers(mode){const pairs=[[166,92,-46],[320,49,46],[474,92,46],[166,270,-46],[320,300,46],[474,270,46]];return pairs.map(([x,y,offset],i)=>{const hx=x+offset,edge=hx+(offset<0?16:-16),end=x+(offset<0?-17:17);return `<g class="helper-pair" data-helper="${i+1}" aria-label="第 ${i+1} 位組員的協助者">${agentIcon(hx,y,'#e1bf7c','external')}<path class="${mode==='refuse'?'blocked':'hint'}" d="M${edge} ${y-20}L${end} ${y-20}" fill="none" stroke="${mode==='refuse'?'#d87f77':'#dacc84'}" stroke-dasharray="3 3" stroke-width="2.5"/>${mode==='refuse'?`<path class="reveal" d="M${(hx+x)/2-5} ${y-25}l10 10m0-10l-10 10" stroke="#dc8a7a" stroke-width="2"/>`:''}</g>`}).join('')}
function gadgetCards(){const items=[['國泰學習網','<circle cx="32" cy="32" r="23"/><circle cx="32" cy="32" r="14" opacity=".45"/><path d="M32 9v23l15-15M9 32h46M32 32v23"/><circle cx="22" cy="38" r="3" fill="currentColor"/>'],['Hahow','<path d="M29 25L7 15v34l22-10m6-14 22-10v34L35 39"/><rect x="26" y="23" width="12" height="18" rx="4"/><path d="M14 27l8 5-8 5Z" fill="currentColor" stroke="none"/>'],['威課講堂','<rect x="9" y="22" width="35" height="25" rx="5"/><circle cx="20" cy="14" r="7"/><circle cx="36" cy="14" r="7"/><path d="M44 29l12-7v25l-12-7M20 47l-5 9m18-9 5 9M17 33h18"/>'],['HyRead電子書','<rect x="13" y="6" width="38" height="52" rx="6"/><path d="M20 17h24M20 24h24M20 31h16M20 38h20"/><circle cx="32" cy="50" r="2"/>']];return `<div class="gadget-cards">${items.map(([name,art],i)=>`<div class="gadget-card gadget-${i}"><div class="gadget-icon"><svg viewBox="0 0 64 64" role="img" aria-label="${['偵探雷達','領結播放器','迷你放映機','電子閱讀器'][i]}" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">${art}</svg></div><h3>${name}</h3></div>`).join('')}</div>`}

function puzzleScene(mode,selected){const assembled=['practice','guide'].includes(mode);const blind=!['standby','familiar'].includes(mode);const centers=[[235,112],[320,112],[405,112],[235,236],[320,236],[405,236]];const dest=[[240,143],[320,143],[400,143],[240,203],[320,203],[400,203]];return `<defs><g id="puzzle-picture"><rect width="240" height="120" fill="#101c2c"/><image href="assets/puzzle-team.png" x="0" y="0" width="240" height="120" preserveAspectRatio="xMidYMid meet"/></g>${puzzleShapes.map((d,i)=>`<clipPath id="tile-${i}"><path d="${d}"/></clipPath>`).join('')}</defs><rect width="640" height="340" fill="#101f2c"/><ellipse cx="320" cy="174" rx="211" ry="151" fill="#18303c" stroke="#3b5562"/><rect x="196" y="109" width="248" height="128" rx="5" fill="#0a1722" stroke="#8b9c91" stroke-dasharray="4 6"/>${centers.map(([x,y])=>`<circle cx="${x}" cy="${y}" r="39" fill="#213c46" stroke="#55717b" opacity="${assembled?'.3':'.85'}"/>`).join('')}${[[166,92],[320,49],[474,92],[166,270],[320,300],[474,270]].map(([x,y],i)=>agentIcon(x,y,['#cfb184','#83aabc','#b98e91'][i%3],mode==='fatigue'?'puzzler':'',blind)).join('')}${puzzleShapes.map((d,i)=>{const [x,y]=centers[i];const bx=i%3*80+40,by=Math.floor(i/3)*60+30;return `<g transform="translate(${x-bx} ${y-by})"><g class="puzzle-tile ${assembled?'tile-join':mode==='blind'||mode==='fatigue'||mode==='refuse'?'tile-search':mode==='familiar'?'tile-look':''}" style="--join-x:${dest[i][0]-x}px;--join-y:${dest[i][1]-y}px;--tile-delay:${i*.3}s;transform-origin:${bx}px ${by}px"><g clip-path="url(#tile-${i})"><use href="#puzzle-picture"/></g><path d="${d}" fill="none" stroke="#ebdcba" stroke-width="1.3"/></g></g>`}).join('')}${['guide','inspect','refuse'].includes(mode)?puzzleHelpers(mode):''}${assembled?'<rect class="puzzle-finish" x="200" y="113" width="240" height="120" rx="3" fill="none" stroke="#efd393" stroke-width="3"/>':''}`}

function actionScene(){const selected=!!feedback;const [mode,story]=selected?actions[active][steps[active]*2+feedback.choice]:['standby',''];const beats=story.split('｜');let art='',extra='',motion='0%,100%{transform:none}';
if(active===1){const multi=['crowd','assume','ten','thirty','gamble'].includes(mode);if(selected&&!['rules','ten','thirty'].includes(mode))motion='0%,12%{transform:translate(0,0)}35%{transform:translate(140px,-15px)}53%{transform:translate(210px,-45px)}72%,100%{transform:translate(270px,-15px)}';if(['ten','thirty'].includes(mode))motion='0%,100%{transform:translate(200px,-20px)}';
art=`<ellipse cx="365" cy="204" rx="160" ry="90" fill="#263e4222" stroke="#e9ce82" stroke-width="3"/>${[1,2,3].map((n,j)=>`<g class="number n${n}"><circle cx="${280+j*65}" cy="${210-(j===1?30:0)}" r="23" fill="#284252" stroke="#92abb8"/><text x="${280+j*65}" y="${217-(j===1?30:0)}" fill="#e8d49b" text-anchor="middle" font-size="22">${n}</text></g>`).join('')}${agentIcon(115,210,'#cdad7f','actor actor1')}${agentIcon(95,245,'#7da8b8',multi?'actor actor2':'support')}${agentIcon(80,285,'#b18188',mode==='crowd'?'actor actor3':'support')}${agentIcon(570,135,'#8fada1','support')}`;
if(multi)extra=`<g class="result"><rect x="415" y="44" width="210" height="42" rx="8" fill="#542e37"/><text x="520" y="72" fill="#ffb6a0" text-anchor="middle" font-size="16">${mode==='ten'?'估算 +10？實際 +30':mode==='thirty'?'+30 秒（示例）':'多人進圈 · 持續罰時'}</text></g><text class="counter count1" x="460" y="305" fill="#f5a594">+10 秒</text><text class="counter count2" x="460" y="305" fill="#f5a594">+20 秒</text>`;
if(mode==='rules')extra='<g class="reveal"><rect x="235" y="133" width="260" height="110" rx="8" fill="#e7dfcb"/><text x="255" y="168" fill="#293b4b" font-size="17">人員限制：一人</text><text x="255" y="203" fill="#9a4141" font-size="21">多一人，每秒 +10 秒</text><path d="M255 214H475" stroke="#bd6248" stroke-width="3"/></g>';
if(['single','optimize'].includes(mode))extra='<path class="hint" d="M565 145L430 177M94 283L260 225" stroke="#84c8cf" stroke-width="3" stroke-dasharray="6 5"/>';
}
if(active===0){art=robotSet(mode,selected);}
if(active===2){art=puzzleScene(mode,selected);}
return `<div class="action-stage case-stage-${active} ${selected?'playing':'waiting'} mode-${mode}" data-action="${mode}"><style>@keyframes travel{${motion}}</style><svg viewBox="0 0 640 340" role="img" aria-label="${selected?beats.join('，'):cases[active].sub+'，角色待命'}"><rect width="640" height="340" fill="#0c1d2b"/>${art}${extra}</svg></div>`}
let gamePhase='intro',gameTimer=null;
function reduced(){return typeof matchMedia==='function'&&matchMedia('(prefers-reduced-motion: reduce)').matches}
function replayScene(){if(!feedback)return;gamePhase='playing';render()}
function retryChoice(){feedback=null;solved=false;gamePhase='choices';render()}
function showChoices(){clearTimeout(gameTimer);gamePhase='choices';paintControls()}
function paintControls(){const holder=document.getElementById('gameControls');if(!holder)return;const q=cases[active].steps[steps[active]];if(!q)return;
if(gamePhase==='intro'){holder.innerHTML=`<button class="scene-start" onclick="showChoices()">觀察現場，準備行動 →</button>`;return}
if(gamePhase==='playing'){holder.innerHTML='<span class="action-running" role="status">行動中…</span>';return}
if(gamePhase==='choices'){holder.innerHTML=`<section class="choice-popup"><p class="popup-story">${q.story}</p><h2>${q.question}</h2><div class="choices">${q.options.map((t,i)=>`<button onclick="choose(${i})"><span class="option-letter">${i?'B':'A'}</span><span>${t}</span></button>`).join('')}</div></section>`;return}
holder.innerHTML=`<section class="result-popup" role="status"><h2>${feedback.ok?'線索確認':'再想一種方法'}</h2><p>${feedback.text}</p><div class="result-actions"><button class="ghost" onclick="replayScene()">↻ 重播</button>${feedback.ok?button(steps[active]===cases[active].steps.length-1?'取得鑰匙 →':'下一步 →','advance()'):button('重新選擇 →','retryChoice()')}</div></section>`}
function scheduleGame(){clearTimeout(gameTimer);if(page!=='case'||steps[active]>=cases[active].steps.length)return;paintControls();if(gamePhase==='intro')gameTimer=setTimeout(showChoices,reduced()?0:1400);if(gamePhase==='playing')gameTimer=setTimeout(()=>{gamePhase='result';paintControls()},reduced()?150:6800)}
function pauseBgmForVideo(){const music=document.getElementById('bgm');music.pause();const control=document.getElementById('musicToggle');control.textContent='♫ 配樂';control.setAttribute('aria-pressed','false')}
async function toggleMusic(){const music=document.getElementById('bgm'),control=document.getElementById('musicToggle');if(!music.paused){music.pause();control.textContent='♫ 配樂';control.setAttribute('aria-pressed','false');return}music.volume=.3;try{await music.play();control.textContent='♫ 靜音';control.setAttribute('aria-pressed','true')}catch{control.textContent='♫ 點此重試'}}
function toggleFull(){if(!document.fullscreenElement){document.documentElement.requestFullscreen?.().catch(()=>{})}else{document.exitFullscreen?.()}}

function go(p){clearTimeout(gameTimer);page=p;feedback=null;gamePhase='intro';render();window.scrollTo(0,0)}
function openCase(i){if(i>0&&!completed[i-1])return;active=i;solved=false;go('case')}
function choose(i){if(solved||gamePhase!=='choices')return;const q=cases[active].steps[steps[active]];solved=i===q.correct;feedback={ok:solved,text:solved?q.good:q.bad,choice:i};gamePhase='playing';render()}
function advance(){if(!solved||gamePhase!=='result')return;steps[active]++;feedback=null;solved=false;gamePhase='intro';if(steps[active]===cases[active].steps.length)completed[active]=true;render();window.scrollTo(0,0)}
function restart(){steps=[0,0,0];completed=[false,false,false];active=0;solved=false;go('intro')}
function render(){clearTimeout(gameTimer);document.body.classList.toggle('in-game',page==='case'&&steps[active]<cases[active].steps.length);let out='';const c=cases[active];if(page==='intro')out=frame(`<div class="eyebrow">INTERACTIVE DETECTIVE STORY</div><h1 class="invitation-title">來自淡水豪宅的<br>邀請函：<em>敏捷篇</em></h1><p>一封來自淡水豪宅的邀請函，將你們帶到三道機關之前。機器人留下歪斜輪跡，古老收銀機吞噬時間，無光房間藏著破碎地圖。你們將用柯南式的觀察與推理，追查三個案件。</p><p>三關共九道選擇題，每題只有兩個選項。選錯，重新檢視流程後再試一次。選對，啟動機關。完成一關取得一把鑰匙，開啟下一道門。</p>${button('集結偵探小隊 →',"go('team')")}`,`<span class="stamp">機密委託 · 三把鑰匙</span>${detectiveArt()}<h2>不是一次猜中答案</h2><p>而是在每次回饋之後，<br>做出更好的下一步。</p><hr><p>01 失控的機械密室<br>02 古老收銀機的十秒陷阱<br>03 無光房間的第七雙眼</p>`);
if(page==='team')out=`<section class="roster-page"><div class="roster-heading"><div><div class="eyebrow">TEAM ROSTER</div><h1>偵探團名冊</h1><p>每位偵探都有自己的專長，一起追查三道密室。</p></div><span class="tag">本組職能：敏捷力</span></div><div class="roster-scroll"><div class="roster-photo"><img src="assets/detective-team.png" alt="六位偵探由左至右：灰原頤、阿聖博士、亮戶川柯南、毛利蓉、瑋谷光彥、瑜田步美"/><div class="character-tag" style="left:9%"><strong>灰原頤</strong><span class="character-type">冷靜型</span><p>李欣頤<br>有價證券交易科</p></div><div class="character-tag" style="left:24.5%"><strong>阿聖博士</strong><span class="character-type">後援型</span><p>劉昭聖<br>投資程式設計科</p></div><div class="character-tag" style="left:40.5%"><strong>亮戶川柯南</strong><span class="character-type">敏捷型</span><p>林亮志<br>業務企劃科</p></div><div class="character-tag" style="left:56.5%"><strong>毛利蓉</strong><span class="character-type">力量型</span><p>湯宜蓉<br>法律事務科</p></div><div class="character-tag" style="left:73%"><strong>瑋谷光彥</strong><span class="character-type">智慧型</span><p>黃晧瑋<br>債券投資科</p></div><div class="character-tag" style="left:90%"><strong>瑜田步美</strong><span class="character-type">靈巧型</span><p>李婕瑜<br>數位客戶經營科</p></div></div></div><div class="roster-start">${button('全員就位，開啟案件地圖 →',"go('map')")}</div></section>`;
if(page==='map')out=`<div class="eyebrow">CASE MAP / 已完成 ${completed.filter(Boolean).length} / 3 關</div><h1 class="scene-title">循著線索，<em>逐關解鎖。</em></h1><div class="case-map">${cases.map((x,i)=>`<button ${i>0&&!completed[i-1]?'disabled':''} onclick="openCase(${i})"><small>CASE 0${i+1} · ${x.sub}</small>${sceneArt(i)}<b>${completed[i]?'✓ ':i>0&&!completed[i-1]?'🔒 ':''}${x.title}</b><br>${completed[i]?'已取得鑰匙：'+x.word:i>0&&!completed[i-1]?'完成上一關後解鎖':`進度 ${steps[i]} / ${x.steps.length} · 開始調查 →`}</button>`).join('')}</div>${completed.every(Boolean)?button('破解最終密碼 →',"go('final')"):''}`;
if(page==='case'&&steps[active]<cases[active].steps.length){const q=c.steps[steps[active]];out=`<article class="mission compact-mission"><div class="mission-top"><button class="ghost" onclick="go('map')">← 地圖</button><h1>${q.title}</h1><span>0${active+1} ／ ${steps[active]+1}・${c.steps.length}</span></div><div class="playfield"><div id="actionHolder">${actionScene()}</div><div id="gameControls" class="game-controls"></div></div></article>`}
if(page==='case'&&steps[active]===cases[active].steps.length)out=frame(`<div class="eyebrow">CASE 0${active+1} / 任務完成</div>${keyAward(active)}<h1 class="scene-title">鑰匙密碼：<br><em>${c.word}</em></h1><p>${c.lesson}</p><div class="feedback"><b>回到工作現場</b><br>${c.work}</div>${button(active===2?'用三把鑰匙開啟最終檔案 →':'帶著鑰匙，開啟下一道門 →',active===2?"go('final')":`openCase(${active+1})`)}`,`<div class="door-scene"><div class="door">⌕</div></div><span class="stamp">實際經歷 · 結訓證詞</span><h2>${c.sub}</h2><p>${c.facts}</p><hr><p>故事任務已完成。<br>請組員分享：當時哪一個回饋，讓我們決定改變？</p>`);
if(page==='final')out=frame(`<div class="eyebrow">CASE CLOSED / 三案結訓報告</div><h1 class="scene-title">敏捷的真相：<br><em>依新證據，改變下一步。</em></h1><p>機器人教我們小步快走；收銀機教我們實驗修正；盲眼拼圖讓我們透過即時回饋快人一步。</p><div class="clues">${cases.map(c=>`<span class="clue done">✓ ${c.word}</span>`).join('')}</div><p>「每次嘗試留下線索，每次修正讓我們更接近答案。」</p>${button('展開工作中的下一案 →',"go('work')")}`,`<div class="door-scene"><div class="door">Ⅰ</div><div class="door">Ⅱ</div><div class="door">Ⅲ</div></div><span class="stamp">敏捷力 · 三項具體行為</span><h2>試 → 看 → 修 → 再試</h2><p><b>小步快走</b><br>從雛形出發，換環境就重新測試。</p><p><b>實驗修正</b><br>理解規則成本，從失敗中調整策略。</p><p><b>快人一步</b><br>藉由外部即時回饋突破瓶頸，找到有效路徑。</p>`);
if(page==='work')out=frame(`<div class="eyebrow">NEXT CASE / 未來應用提案</div><h1 class="scene-title">讓敏捷力，<br><em>走進日常工作。</em></h1><div class="detail">① 選一項任務，先做可檢視的小版本。<br>② 找同事或使用者提供回饋，補足盲點。<br>③ 確認規則與限制，再調整流程。<br>④ 比較調整前後的結果，決定下一步。</div><p>從一個小實驗開始，把學到的新方法用一次，再依回饋修正。</p>${button('下一頁：影片時間 →',"go('video')")} <button class="ghost" onclick="go('map')">案件地圖</button>`, `<h2>阿笠博士的發明：</h2>${gadgetCards()}`);
if(page==='video')out=`<section class="ending-page video-page"><div class="eyebrow">SPECIAL SCREENING</div><h1>影片時間</h1><div class="video-frame"><video id="closingVideo" controls playsinline preload="metadata" src="assets/closing-video.mov" onplay="pauseBgmForVideo()">你的瀏覽器無法播放這部影片。</video></div><div class="ending-actions"><button class="ghost" onclick="go('work')">← 未來與學習</button><a class="video-file" href="assets/closing-video.mov" target="_blank" rel="noopener">開啟影片檔</a>${button('下一頁：互動遊戲 →',"go('interactive')")}</div></section>`;
if(page==='interactive')out=`<section class="ending-page qr-page"><div class="eyebrow">LET’S PLAY TOGETHER</div><h1>互動遊戲時間</h1><p class="qr-invitation">請掃描qrcode一起玩吧！</p><div class="qr-card"><img src="assets/game-qrcode.png" width="408" height="408" alt="互動遊戲 QR Code，請使用手機相機掃描"/></div><div class="ending-actions"><button class="ghost" onclick="go('video')">← 回到影片</button></div></section>`;
document.getElementById('inventory').innerHTML=cases.map((x,i)=>`<div class="slot ${completed[i]?'owned':''}">${keySvg(i)}<span>${completed[i]?x.word:'未取得'} · CASE 0${i+1}</span></div>`).join('');document.getElementById('scene').innerHTML=out;document.getElementById('nav').innerHTML=[['序章','intro'],['組員','team'],['案件地圖','map'],['結案','final'],['未來與學習','work'],['影片時間','video'],['互動遊戲','interactive']].map(([t,p])=>`<button class="${page===p?'active':''}" ${['final','work'].includes(p)&&!completed.every(Boolean)?'disabled':''} onclick="go('${p}')">${t}</button>`).join('');scheduleGame()}

render();
</script></html>
